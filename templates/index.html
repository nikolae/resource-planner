<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resource Planner</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header>
    <div class="header-left">
      <h1 id="app-title">Resource Planner</h1>
      <div class="project-selector">
        <select id="project-select">
          <option value="">All Projects</option>
        </select>
        <button id="btn-add-project" class="btn btn-ghost btn-icon" title="New project">+</button>
        <button id="btn-edit-project" class="btn btn-ghost btn-icon" title="Edit project" style="display:none">&#9998;</button>
        <button id="btn-manage-projects" class="btn btn-ghost btn-icon" title="Manage projects">&#9776;</button>
      </div>
    </div>
    <div class="header-actions">
      <div class="view-toggle">
        <button id="btn-view-tasks" class="btn btn-toggle active">Tasks</button>
        <button id="btn-view-resources" class="btn btn-toggle">Resources</button>
      </div>
      <button id="btn-add-task" class="btn btn-primary">+ Task</button>
      <button id="btn-manage-resources" class="btn btn-secondary">Resources</button>
      <button id="btn-seed" class="btn btn-ghost">Load Demo Data</button>
      <button id="btn-settings" class="btn btn-ghost btn-icon" title="Settings">&#9881;</button>
      <div class="zoom-controls" title="Horizontal zoom">
        <button id="btn-zoom-out" class="btn btn-ghost btn-icon" title="Zoom out">&minus;</button>
        <span id="zoom-label">Day</span>
        <button id="btn-zoom-in" class="btn btn-ghost btn-icon" title="Zoom in">+</button>
      </div>
      <div class="zoom-controls" title="Vertical zoom">
        <button id="btn-vzoom-out" class="btn btn-ghost btn-icon" title="Shorter rows">&darr;</button>
        <span id="vzoom-label">M</span>
        <button id="btn-vzoom-in" class="btn btn-ghost btn-icon" title="Taller rows">&uarr;</button>
      </div>
    </div>
  </header>

  <main>
    <div class="gantt-wrapper">
      <div class="gantt-sidebar" id="gantt-sidebar">
        <div class="sidebar-header" id="sidebar-header">
          <span class="col-name" data-col="0">Task<span class="col-resize-handle"></span></span>
          <span class="col-resource" data-col="1">Resource<span class="col-resize-handle"></span></span>
          <span class="col-dates" data-col="2">Start<span class="col-resize-handle"></span></span>
          <span class="col-dates" data-col="3">End</span>
        </div>
        <div class="sidebar-body" id="sidebar-body"></div>
      </div>
      <div class="sidebar-resize-handle" id="sidebar-resize-handle"></div>
      <button class="sidebar-toggle" id="sidebar-toggle" title="Toggle sidebar">&#9664;</button>
      <div class="gantt-chart-area" id="gantt-chart-area">
        <div class="chart-header" id="chart-header"></div>
        <div class="chart-body" id="chart-body">
          <canvas id="gantt-canvas"></canvas>
          <svg id="dep-svg"></svg>
          <svg id="link-svg"></svg>
        </div>
      </div>
    </div>
  </main>

  <!-- Task modal -->
  <div class="modal-overlay" id="task-modal">
    <div class="modal">
      <h2 id="task-modal-title">New Task</h2>
      <form id="task-form">
        <input type="hidden" id="task-id">
        <label>Name <input type="text" id="task-name" required></label>
        <label>Description <textarea id="task-desc" rows="2"></textarea></label>
        <div class="form-row">
          <label>Start <input type="date" id="task-start" required></label>
          <label>End <input type="date" id="task-end" required></label>
        </div>
        <div class="form-row">
          <label>Resources
            <div class="resource-checklist" id="task-resources"></div>
          </label>
          <label>Progress (%)
            <input type="number" id="task-progress" min="0" max="100" value="0">
          </label>
        </div>
        <div class="form-row">
          <label>Color
            <div class="color-picker-group" data-target="task-color">
              <input type="color" id="task-color" value="#4a86c8">
              <div class="color-swatches"></div>
              <div class="color-recents"></div>
            </div>
          </label>
          <label>Project
            <select id="task-project"><option value="">— none —</option></select>
          </label>
        </div>
        <div class="form-row">
          <label>Parent task
            <select id="task-parent"><option value="">— none —</option></select>
          </label>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" id="btn-task-cancel">Cancel</button>
          <button type="button" class="btn btn-danger" id="btn-task-delete" style="display:none">Delete</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Resource edit modal -->
  <div class="modal-overlay" id="resource-modal">
    <div class="modal">
      <h2 id="resource-modal-title">New Resource</h2>
      <form id="resource-form">
        <input type="hidden" id="res-id">
        <label>Name <input type="text" id="res-name" required></label>
        <label>Role <input type="text" id="res-role"></label>
        <label>Color
          <div class="color-picker-group" data-target="res-color">
            <input type="color" id="res-color" value="#4a86c8">
            <div class="color-swatches"></div>
            <div class="color-recents"></div>
          </div>
        </label>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" id="btn-res-cancel">Cancel</button>
          <button type="button" class="btn btn-danger" id="btn-res-delete" style="display:none">Delete</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Resource list modal -->
  <div class="modal-overlay" id="resource-list-modal">
    <div class="modal modal-wide">
      <div class="modal-header-row">
        <h2>Resources</h2>
        <button type="button" class="btn btn-primary" id="btn-add-resource-from-list">+ Add Resource</button>
      </div>
      <div id="resource-list-body"></div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="btn-res-select-all">Select All</button>
        <button type="button" class="btn btn-danger" id="btn-res-list-delete" style="display:none">Delete Selected</button>
        <button type="button" class="btn btn-ghost" id="btn-res-list-close">Close</button>
      </div>
    </div>
  </div>

  <!-- Project modal -->
  <div class="modal-overlay" id="project-modal">
    <div class="modal">
      <h2 id="project-modal-title">New Project</h2>
      <form id="project-form">
        <input type="hidden" id="proj-id">
        <label>Name <input type="text" id="proj-name" required></label>
        <label>Description <textarea id="proj-desc" rows="2"></textarea></label>
        <label>Color
          <div class="color-picker-group" data-target="proj-color">
            <input type="color" id="proj-color" value="#4a86c8">
            <div class="color-swatches"></div>
            <div class="color-recents"></div>
          </div>
        </label>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" id="btn-proj-cancel">Cancel</button>
          <button type="button" class="btn btn-danger" id="btn-proj-delete" style="display:none">Delete</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Project list modal -->
  <div class="modal-overlay" id="project-list-modal">
    <div class="modal modal-wide">
      <div class="modal-header-row">
        <h2>Projects</h2>
        <button type="button" class="btn btn-primary" id="btn-add-project-from-list">+ Add Project</button>
      </div>
      <div id="project-list-body"></div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="btn-proj-select-all">Select All</button>
        <button type="button" class="btn btn-danger" id="btn-proj-list-delete" style="display:none">Delete Selected</button>
        <button type="button" class="btn btn-ghost" id="btn-proj-list-close">Close</button>
      </div>
    </div>
  </div>

  <!-- Settings modal -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal">
      <h2>Settings</h2>
      <form id="settings-form">
        <label>Application Name <input type="text" id="cfg-app-name"></label>
        <label>Host <input type="text" id="cfg-host"></label>
        <label>Port <input type="number" id="cfg-port" min="1" max="65535"></label>
        <label>Debug mode
          <select id="cfg-debug">
            <option value="true">On</option>
            <option value="false">Off</option>
          </select>
        </label>
        <label>Database URI <input type="text" id="cfg-db-uri"></label>
        <p class="settings-note">Changes to host, port, and database URI take effect after restarting the server.</p>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" id="btn-settings-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Dependency modal -->
  <div class="modal-overlay" id="dep-modal">
    <div class="modal">
      <h2>Add Dependency</h2>
      <form id="dep-form">
        <label>Predecessor
          <select id="dep-pred" required></select>
        </label>
        <label>Successor
          <select id="dep-succ" required></select>
        </label>
        <label>Type
          <select id="dep-type">
            <option value="FS">Finish &rarr; Start</option>
            <option value="SS">Start &rarr; Start</option>
            <option value="FF">Finish &rarr; Finish</option>
            <option value="SF">Start &rarr; Finish</option>
          </select>
        </label>
        <label>Lag (days) <input type="number" id="dep-lag" value="0"></label>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" id="btn-dep-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary">Add</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Context menu for dependency -->
  <div class="context-menu" id="ctx-menu" style="display:none">
    <button id="ctx-add-dep">Link dependency&hellip;</button>
    <button id="ctx-edit-task">Edit task</button>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
